<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">QuotaMate Compact Mode on macOS and Windows</title>
  <desc id="desc">The macOS menu bar shows live Codex quota text and opens a detailed panel, while Windows uses a small draggable desktop widget.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12121b"/>
      <stop offset="1" stop-color="#292044"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#7147f5"/>
      <stop offset="1" stop-color="#a887ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07060d" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#background)"/>
  <circle cx="1100" cy="500" r="250" fill="#7248f5" opacity=".08"/>
  <circle cx="85" cy="80" r="180" fill="#36c6cf" opacity=".04"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif">
    <text x="58" y="67" fill="#f7f5fc" font-size="29" font-weight="700">Compact Mode</text>
    <text x="58" y="98" fill="#aaa6b8" font-size="16">Live quota at a glance · Details only when you need them</text>

    <g filter="url(#shadow)">
      <rect x="58" y="133" width="1084" height="68" rx="17" fill="#ececf0"/>
      <circle cx="86" cy="167" r="7" fill="#ff5f57"/>
      <circle cx="109" cy="167" r="7" fill="#febc2e"/>
      <circle cx="132" cy="167" r="7" fill="#28c840"/>
      <text x="173" y="174" fill="#22222a" font-size="15" font-weight="650">QuotaMate</text>
      <text x="762" y="174" fill="#22222a" font-size="15">⌁</text>
      <text x="793" y="174" fill="#22222a" font-size="15">Wi-Fi</text>
      <text x="860" y="174" fill="#22222a" font-size="15">◉</text>
      <text x="887" y="174" fill="#22222a" font-size="16" font-weight="650">5h 99% · W 58%</text>
      <text x="1064" y="174" fill="#22222a" font-size="15">09:04</text>
    </g>

    <text x="58" y="234" fill="#9d79ff" font-size="13" font-weight="700" letter-spacing="1.2">macOS MENU BAR</text>
    <text x="58" y="263" fill="#d5d1df" font-size="17">The selected quota stays visible beside the native menu bar icon.</text>
    <text x="58" y="291" fill="#9691a3" font-size="15">Choose 5h, Weekly, or both — no desktop widget required.</text>

    <g filter="url(#shadow)">
      <path d="M817 217h292a17 17 0 0 1 17 17v261a17 17 0 0 1-17 17H817a17 17 0 0 1-17-17V234a17 17 0 0 1 17-17z" fill="#242330" stroke="#514c64"/>
      <path d="m941 217 12-16 12 16" fill="#242330"/>
      <rect x="822" y="239" width="32" height="32" rx="9" fill="url(#accent)"/>
      <text x="838" y="261" text-anchor="middle" fill="white" font-size="17" font-weight="800">C</text>
      <text x="866" y="260" fill="#f3f0f8" font-size="16" font-weight="700">Codex Usage</text>
      <text x="1095" y="260" text-anchor="end" fill="#a887ff" font-size="15">↻</text>

      <rect x="822" y="288" width="282" height="82" rx="12" fill="#2c2b39" stroke="#454253"/>
      <text x="838" y="315" fill="#dcd9e6" font-size="14" font-weight="650">5 Hour</text>
      <text x="1087" y="315" text-anchor="end" fill="#f4f1fa" font-size="19" font-weight="750">99% left</text>
      <rect x="838" y="329" width="249" height="7" rx="4" fill="#514e5e"/>
      <rect x="838" y="329" width="246" height="7" rx="4" fill="url(#accent)"/>
      <text x="838" y="355" fill="#9e99ac" font-size="11">Resets in 2h 07m</text>

      <rect x="822" y="383" width="282" height="82" rx="12" fill="#2c2b39" stroke="#454253"/>
      <text x="838" y="410" fill="#dcd9e6" font-size="14" font-weight="650">Weekly</text>
      <text x="1087" y="410" text-anchor="end" fill="#f4f1fa" font-size="19" font-weight="750">58% left</text>
      <rect x="838" y="424" width="249" height="7" rx="4" fill="#514e5e"/>
      <rect x="838" y="424" width="144" height="7" rx="4" fill="url(#accent)"/>
      <text x="838" y="450" fill="#9e99ac" font-size="11">Resets in 5d 11h</text>

      <text x="963" y="492" text-anchor="middle" fill="#9c96aa" font-size="12">Click for details · move away to close</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="58" y="350" width="456" height="82" rx="18" fill="#242330" stroke="#555069"/>
      <rect x="80" y="371" width="40" height="40" rx="11" fill="url(#accent)"/>
      <text x="100" y="398" text-anchor="middle" fill="white" font-size="21" font-weight="800">C</text>
      <text x="143" y="398" fill="#aaa5b7" font-size="16">5h</text>
      <text x="173" y="398" fill="#f5f2fa" font-size="22" font-weight="750">99%</text>
      <path d="M258 373v36" stroke="#504c5d"/>
      <text x="282" y="398" fill="#aaa5b7" font-size="16">W</text>
      <text x="308" y="398" fill="#f5f2fa" font-size="22" font-weight="750">58%</text>
    </g>

    <text x="58" y="472" fill="#9d79ff" font-size="13" font-weight="700" letter-spacing="1.2">WINDOWS COMPACT WIDGET</text>
    <text x="58" y="501" fill="#d5d1df" font-size="17">A tiny draggable desktop bar with click-to-expand details.</text>
    <text x="58" y="529" fill="#9691a3" font-size="15">Its width follows the values you choose to display.</text>
  </g>
</svg>
