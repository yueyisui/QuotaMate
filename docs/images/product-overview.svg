      <stop offset="1" stop-color="#a887ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#08070d" flood-opacity=".55"/>
